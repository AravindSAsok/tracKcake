name: TrackCake model benchmark

on:
  push:
    branches: [main]
    paths:
      - "scripts/benchmark-models.mjs"

permissions:
  contents: write

concurrency:
  group: trackcake-model-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Configure benchmark commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run benchmark; publish every result before continuing
        env:
          TRACKCAKE_URL: https://trackcake.vercel.app
        run: node scripts/benchmark-models.mjs

      - name: Preserve latest report as a workflow artifact even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trackcake-benchmark-${{ github.run_id }}
          path: benchmark.md
          if-no-files-found: warn
          retention-days: 90
